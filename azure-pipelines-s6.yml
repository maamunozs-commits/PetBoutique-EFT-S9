trigger:
  branches:
    include: [codex/petboutique-exp2-s6]
pool:
  vmImage: ubuntu-latest
steps:
- checkout: self
- bash: |
    set -euo pipefail
    mkdir -p s6
    unzip -q petboutique-s6-source.zip -d s6
    cd s6
    docker compose config --quiet
    docker compose build
    docker compose up -d
    for i in $(seq 1 30); do
      if curl --fail --silent http://127.0.0.1:8080/health; then
        break
      fi
      sleep 2
    done
    python3 verify.py http://127.0.0.1:8080 > results.json
    cat results.json
  displayName: Construir contenedores y verificar 10 casos
- bash: |
    cd s6
    docker compose ps > container-status.txt
    docker compose logs --no-color > container-logs.txt
    docker image ls > images.txt
    docker compose down
  condition: always()
  displayName: Registrar evidencia y detener contenedores del agente
- task: PublishPipelineArtifact@1
  condition: always()
  inputs:
    targetPath: s6
    artifact: petboutique-s6-validation
